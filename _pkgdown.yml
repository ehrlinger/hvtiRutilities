reference:
- title: Data Import
  desc: >
    Read clinical data files as stored. Type conversion is opt-in via
    convert_types, because coercing a two-valued numeric to logical breaks
    0/1 event and censoring flags.
  contents:
  - read_clinical_data

- title: Data Type Conversion
  desc: Automatically infer and convert column types
  contents:
  - r_data_types

- title: Variable Labels
  desc: Extract, look up, register, and override variable labels
  contents:
  - label_map
  - get_label
  - get_labels
  - add_labels
  - apply_label_overrides
  - clean_labels

- title: Data Documentation
  desc: Build data dictionaries, summarise variables, and compare dataset versions
  contents:
  - data_dictionary
  - dataset_schema
  - proc_contents
  - proc_means
  - compare_datasets

- title: Dataset Versioning
  desc: Track and verify dataset integrity with SHA-256 checksums
  contents:
  - update_manifest
  - verify_manifest

- title: Data Generation
  desc: Generate labeled sample and synthetic datasets
  contents:
  - generate_survival_data
  - sample_data

- title: SAS Macro Canonicalization
  desc: Inventory a legacy SAS macro library and resolve name collisions
  contents:
  - sas_triage
  - sas_macro_defs
  - sas_macro_signature
  - write_macro_manifest
  - write_collision_report

- title: SAS Parity
  desc: Compare an R result against its SAS reference under derived tolerances
  contents:
  - parity_tolerance
  - compare_parity
  - parity_headline

- title: Study Setup
  desc: Initialize a study for reproducible analysis, and audit whether it is ready
  contents:
  - study_init
  - study_status
  - study_checklist
  - preflight_report

- title: Study Manifest and Data Contract
  desc: Locate a study from its `_study.yml`, resolve its paths, and read and reconcile its built dataset
  contents:
  - study_config
  - study_root
  - sas_path
  - built_path
  - built_manifest
  - read_built
  - cohort_counts
  - assert_cohort

- title: Provenance
  desc: Record what produced a filed result, in a JSON sidecar beside it
  contents:
  - record_provenance
  - provenance_path

- title: Analysis Taxonomy
  desc: The two-letter prefix system inherited from the CORR analysis binder
  contents:
  - hvti_taxonomy
  - hvti_non_prefixes

- title: Corpus Inventory
  desc: Sweep the job corpus by filename -- which studies ran which job types
  contents:
  - job_files
  - job_census

- title: Candidate Pool Preparation
  desc: >-
    Getting a covariate list out of a SAS job and into a model without changing
    the model on the way. Each of these exists because of a failure that was
    silent: a comment swallowing a variable name, a mean-imputed binary being
    dummy-coded, a screen spending its step budget on five forms of one
    concept, a rank-deficient design from two names for the same thing.
  contents:
  - sas_variable_block
  - covariate_audit
  - imputed_levels
  - covariates_to_numeric
  - pool_collinear_pairs
  - concept_of
  - concept_map
  - prune_to_one_form
  - selection_crowding
  - POOL_AFFIXES

- title: Package Utilities
  contents:
  - hvtiRutilities-package
  - hvtiRutilities.news
  - r_dir_impurities

articles:
- title: Getting Started
  contents:
  - hvtiRutilities

- title: Core Workflows
  contents:
  - data-labels
  - dataset-versioning

- title: SAS Migration
  contents:
  - sas-procedures

- title: Specialized Topics
  contents:
  - survival-data
  - reproducible-seeds

