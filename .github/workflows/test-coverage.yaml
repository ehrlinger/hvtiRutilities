# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  # A commit that only touches the generated house-style artifact cannot change
  # the package: .claude is in .Rbuildignore, so it is excluded from the built
  # package, and no step in this workflow reads it from the checkout. A push
  # that touches only .claude therefore skips this run.
  #
  # Not on pull_request: coverage runs the whole suite a second time,
  # instrumented, and took 35 to 50 minutes a run by October 2026, the last
  # check every PR waited on. A coverage drop now shows on main, after the merge.
  # test-coverage was removed from the ruleset's required checks on 2026-10-26 for
  # this change. Make it required again and every PR waits on a check that never
  # reports, as ehrlinger/hvtiR#65 did at "Expected -- Waiting for status to be
  # reported".
  push:
    paths-ignore:
      - '.claude/**'
    branches: [main]
  workflow_dispatch:

name: test-coverage.yaml

permissions: read-all

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          disable_search: true
          # Fail the build only when a token is configured and the upload
          # still errors -- a missing token should never fail CI, on a PR
          # or otherwise. (The prior `event_name != 'pull_request' || ...`
          # form was unconditionally true on every push regardless of token
          # state, defeating that intent, and risked evaluating to the raw
          # token string rather than a boolean.) A single `!=` comparison
          # can only ever evaluate to `true`/`false`.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
