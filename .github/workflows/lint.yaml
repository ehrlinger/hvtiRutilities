# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # local::. installs the package itself, not just its dependencies.
          # Without it object_usage_linter cannot resolve the package's own
          # internals and reports every call to one as an undefined global.
          extra-packages: any::lintr@3.4.0, local::.

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

  # Catches generated documentation drifting from its roxygen sources, on the
  # PR rather than after the merge. Replaces a `devtools::document()` step that
  # used to run inside R-CMD-check and check-manual: regenerating docs before
  # checking meant the check could never see drift, because it had just fixed
  # it. This one regenerates and then *fails on the diff*.
  #
  # pull_request only. It is seconds, and does not build the manual, so the
  # CRAN check-time budget decision is untouched.
  docs-current:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned because it stamps its own version into
          # DESCRIPTION (Config/roxygen2/version), so
          # an unpinned upgrade fails this check on a version bump rather than
          # a doc change.
          extra-packages: any::roxygen2@8.1.0, local::.
          # roxygenise() only needs this package's Imports loadable. The
          # action defaults to dependencies: "all", which additionally pulls
          # every Suggests -- tidyverse, randomForestSRC, varPro, writexl --
          # and their system requirements, so a job whose real work is a
          # one-second git diff waits on a long apt queue. hvtiRdatasets was
          # stranded there for 32 minutes on 2026-08-07 when a mirror
          # degraded; nothing in R/ references a Suggests package.
          dependencies: '"hard"'

      - name: Documentation is current
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code man/ NAMESPACE DESCRIPTION
