# The group default abbreviation list, phrase: abbreviation. Every study
# inherits it; a study overrides or removes an entry in _study.yml.
# Starter list from the 2026-09-28 label census of 705 studies' built datasets
# (hvtiRutilities dev/specs/2026-09-25-study-abbreviations-design.md, section 8).
# A change here changes every study's labels on its next render, so it goes
# through a pull request with a NEWS line naming the entries changed.
#
# Phrases match whole words, ignoring case, leftmost first, and only in labels
# over the cap. One entry may list spellings of a term, "A | B", which share its
# abbreviation; the first is what a key prints. Two entries may not share an
# abbreviation, ignoring case, except R for replacement against r for repair.
# PVR is left free: in cardiology it usually means pulmonary vascular resistance.

# Chambers and vessels
Left ventricular: LV
Right ventricular: RV
Left atrial: LA
Pulmonary artery: PA
Right coronary artery: RCA
Internal mammary artery: IMA

# Valves
Aortic valve: AV
Mitral valve: MV
Tricuspid valve: TV
Pulmonary valve: PV
Aortic valve replacement: AVR
Aortic valve repair: AVr
Mitral valve replacement: MVR
Mitral valve repair: MVr
Tricuspid valve replacement: TVR
Tricuspid valve repair: TVr
Pulmonary valve repair: PVr

# Procedures and support
Coronary artery bypass graft | Coronary artery bypass grafting: CABG
Percutaneous coronary intervention: PCI
Cardiopulmonary bypass: CPB
Intra-aortic balloon pump: IABP
Carotid endarterectomy: CEA

# Conditions
Coronary artery disease: CAD
Congenital heart disease: CHD
Hypertrophic obstructive cardiomyopathy: HOCM
Atrial fibrillation: AF
Cerebral vascular accident | Cerebrovascular accident: CVA
Transient ischemic attack: TIA
Chronic obstructive pulmonary disease: COPD
Deep sternal wound infection: DSWI
New York Heart Association: NYHA

# Echocardiography
Ejection fraction: EF
Left ventricular inner diameter in diastole | Left ventricular internal diameter in diastole: LVIDd
Left ventricular inner diameter in systole | Left ventricular internal diameter in systole: LVIDs
Relative wall thickness: RWT

# Blood products and course
Fresh frozen plasma: FFP
Red blood cell | Red blood cells: RBC
Length of stay: LOS
Preoperative: Preop
